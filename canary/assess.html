<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Assess">
<meta name="robots" content="noindex, nofollow">
<title>Teste de assessment — Pronunciation Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --navy-900:#080D17; --navy-850:#0B1220; --navy-800:#111A2B;
  --navy-750:#16223A; --navy-700:#1D2C48;
  --ink:#ECEFF4; --ink-dim:#94A1B8; --ink-faint:#5C6B85;
  --brass:#D6B073; --brass-hi:#EFD3A0;
  --amber:#CE9548; --rust:#A9482F;
  --r-sm:10px; --r-md:14px; --r-lg:18px;
  --ease:cubic-bezier(.2,.7,.2,1); --t:200ms;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  background:var(--navy-900); color:var(--ink);
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-variant-numeric:tabular-nums; -webkit-font-smoothing:antialiased;
  padding:max(18px,env(safe-area-inset-top)) 16px calc(18px + env(safe-area-inset-bottom));
  display:flex; justify-content:center;
}
.app{width:100%; max-width:440px; display:flex; flex-direction:column; gap:14px}
:focus-visible{outline:2px solid var(--brass); outline-offset:3px; border-radius:6px}
h1{font-size:13px; font-weight:600; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-faint); margin:0}
.sub{font-size:13px; line-height:1.55; color:var(--ink-dim); margin:0}
.card{background:var(--navy-850); border-radius:var(--r-lg); padding:16px; box-shadow:0 1px 0 rgba(255,255,255,.03) inset, 0 8px 24px rgba(0,0,0,.35)}
.card h2{font-size:10.5px; font-weight:600; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-faint); margin:0 0 12px}
.kv{display:flex; justify-content:space-between; gap:12px; font-size:13px; padding:6px 0; border-bottom:1px solid var(--navy-800)}
.kv:last-child{border-bottom:none}
.kv .k{color:var(--ink-faint)}
.kv .v{color:var(--ink); text-align:right; word-break:break-all}
.v.ok{color:var(--brass)} .v.warn{color:var(--amber)} .v.bad{color:var(--rust)}
button{font:inherit; cursor:pointer; border:none; border-radius:var(--r-md); transition:background var(--t) var(--ease)}
.btn{width:100%; padding:13px 16px; font-size:15px; background:var(--navy-750); color:var(--ink); text-align:center; margin-top:8px}
.btn:hover{background:var(--navy-700)}
.btn.primary{background:var(--brass); color:#1A1206; font-weight:600; padding:18px 16px; font-size:17px}
.btn.primary:hover{background:var(--brass-hi)}
.btn[disabled]{background:var(--navy-700); color:var(--ink-faint); cursor:default}
.phrase{background:var(--navy-900); border-radius:var(--r-sm); padding:14px; font-size:17px; line-height:1.5; color:var(--ink); border:1px solid var(--navy-700)}
.scores{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px}
.score{background:var(--navy-800); border-radius:var(--r-sm); padding:12px}
.score b{display:block; font-size:26px; font-weight:600; color:var(--brass); line-height:1.1}
.score span{display:block; font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-faint); margin-top:4px}
.verdict{border-left:3px solid var(--navy-700); padding:10px 0 10px 12px; margin-top:12px; font-size:13.5px; line-height:1.5}
.verdict.pass{border-color:var(--brass)} .verdict.fail{border-color:var(--rust)}
.verdict b{display:block; font-size:11px; letter-spacing:.14em; text-transform:uppercase; margin-bottom:4px; color:var(--ink-faint)}
.meter{height:8px; border-radius:99px; background:var(--navy-800); overflow:hidden; margin:14px 0 4px}
.meter i{display:block; height:100%; width:0%; background:var(--brass); border-radius:99px}
textarea{width:100%; height:200px; background:var(--navy-900); color:var(--ink-dim); border:1px solid var(--navy-700);
  border-radius:var(--r-sm); padding:10px; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:11px; line-height:1.45; resize:vertical}
.foot{text-align:center; font-size:10px; letter-spacing:.22em; text-transform:uppercase; color:#2E3B52; padding:8px 0 4px}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
<script src="https://cdn.jsdelivr.net/npm/microsoft-cognitiveservices-speech-sdk@1/distrib/browser/microsoft.cognitiveservices.speech.sdk.bundle-min.js"></script>
</head>
<body>
<div class="app">

  <div>
    <h1>Teste de assessment</h1>
    <p class="sub">Passo 3 da Fatia 1. Grava, manda para a Azure e devolve o JSON bruto. É o que responde se o F0 aceita o Pronunciation Assessment.</p>
  </div>

  <div class="card">
    <h2>Sessão</h2>
    <div id="session"></div>
    <button class="btn primary" id="login">Entrar com Google</button>
  </div>

  <div class="card">
    <h2>Frase de referência</h2>
    <div class="phrase" id="phrase"></div>
    <div class="meter"><i id="level"></i></div>
    <button class="btn primary" id="rec" disabled>Gravar</button>
    <p class="sub" style="margin-top:10px">Fale em ritmo normal. O reconhecimento para sozinho no silêncio.</p>
    <div id="verdict"></div>
  </div>

  <div class="card" id="scorecard" style="display:none">
    <h2>Scores</h2>
    <div class="scores" id="scores"></div>
    <div id="extra" style="margin-top:12px"></div>
  </div>

  <div class="card">
    <h2>JSON bruto</h2>
    <textarea id="raw" readonly></textarea>
    <button class="btn" id="copyraw">Copiar JSON</button>
  </div>

  <div class="card">
    <h2>Log</h2>
    <textarea id="log" readonly style="height:130px"></textarea>
    <button class="btn" id="copylog">Copiar log</button>
  </div>

  <div class="foot">Twenty Nine Cyber</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
import {
  getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect,
  getRedirectResult, onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";
import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-functions.js";

const firebaseConfig = {
  apiKey: "AIzaSyAUi8gBzhogTS1qpAOk8nmwTGsP42URFnk",
  authDomain: "pronunciation-lab-29cyber.firebaseapp.com",
  projectId: "pronunciation-lab-29cyber",
  storageBucket: "pronunciation-lab-29cyber.firebasestorage.app",
  messagingSenderId: "228197203836",
  appId: "1:228197203836:web:20397be05d1ed32aec2ef9"
};

const REFERENCE_TEXT = "The thirty-three thieves thought that they thrilled the throne throughout Thursday";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const issueSpeechToken = httpsCallable(getFunctions(app, "us-central1"), "issueSpeechToken");

const $ = id => document.getElementById(id);
const lines = [];
function log(s){ lines.push(new Date().toLocaleTimeString("pt-BR") + "  " + s); $("log").value = lines.join("\n"); }
function kv(k, v, cls){ return `<div class="kv"><span class="k">${k}</span><span class="v ${cls||""}">${v}</span></div>`; }
function verdict(ok, msg){ $("verdict").innerHTML = `<div class="verdict ${ok?"pass":"fail"}"><b>${ok?"Passou":"Falhou"}</b>${msg}</div>`; }

$("phrase").textContent = REFERENCE_TEXT;
const standalone = window.matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
log("app aberto | " + (standalone ? "standalone" : "navegador"));
log("SDK Azure: " + (window.SpeechSDK ? "carregado" : "NÃO CARREGOU"));

getRedirectResult(auth).catch(err => log("redirect: " + err.code));

$("login").addEventListener("click", async () => {
  const provider = new GoogleAuthProvider();
  try{ await signInWithPopup(auth, provider); }
  catch(err){
    log("popup falhou: " + err.code);
    try{ await signInWithRedirect(auth, provider); } catch(e2){ log("redirect falhou: " + e2.code); }
  }
});

onAuthStateChanged(auth, user => {
  if(user){
    $("session").innerHTML = kv("Conta", user.email, "ok");
    $("login").style.display = "none";
    $("rec").disabled = !window.SpeechSDK;
    log("autenticado como " + user.email);
  }else{
    $("session").innerHTML = kv("Conta", "não autenticado", "warn");
    $("login").style.display = "block";
    $("rec").disabled = true;
  }
});

/* ── medidor de nível, só para saber se o microfone captou ── */
async function startMeter(){
  try{
    const stream = await navigator.mediaDevices.getUserMedia({ audio:true });
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    await ctx.resume();
    const an = ctx.createAnalyser(); an.fftSize = 1024;
    ctx.createMediaStreamSource(stream).connect(an);
    const buf = new Uint8Array(an.fftSize);
    let peak = 0, raf;
    const tick = () => {
      an.getByteTimeDomainData(buf);
      let max = 0;
      for(let i=0;i<buf.length;i++){ const d = Math.abs(buf[i]-128)/128; if(d>max) max = d; }
      if(max > peak) peak = max;
      $("level").style.width = Math.min(100, max*140) + "%";
      raf = requestAnimationFrame(tick);
    };
    tick();
    return { stop(){ cancelAnimationFrame(raf); $("level").style.width = "0%";
      stream.getTracks().forEach(t=>t.stop()); ctx.close().catch(()=>{}); return peak; } };
  }catch(e){ log("medidor não iniciou: " + e.name); return { stop(){ return -1; } }; }
}

$("rec").addEventListener("click", async () => {
  const btn = $("rec");
  btn.disabled = true; btn.textContent = "Pedindo token…";
  $("verdict").innerHTML = ""; $("scorecard").style.display = "none"; $("raw").value = "";

  let token, region;
  try{
    const res = await issueSpeechToken();
    token = res.data.token; region = res.data.region;
    log("token ok | " + token.length + " caracteres | " + region);
  }catch(err){
    btn.disabled = false; btn.textContent = "Gravar";
    log("token falhou: " + err.code + " — " + err.message);
    return verdict(false, "Não consegui token: " + err.code);
  }

  const S = window.SpeechSDK;
  const speechConfig = S.SpeechConfig.fromAuthorizationToken(token, region);
  speechConfig.speechRecognitionLanguage = "en-US";

  const paConfig = new S.PronunciationAssessmentConfig(
    REFERENCE_TEXT,
    S.PronunciationAssessmentGradingSystem.HundredMark,
    S.PronunciationAssessmentGranularity.Phoneme,
    true /* enableMiscue — sem isso, omissão e inserção nunca aparecem */
  );
  paConfig.phonemeAlphabet = "IPA";
  paConfig.enableProsodyAssessment = true;

  const audioConfig = S.AudioConfig.fromDefaultMicrophoneInput();
  const recognizer = new S.SpeechRecognizer(speechConfig, audioConfig);
  paConfig.applyTo(recognizer);

  const meter = await startMeter();
  btn.textContent = "Gravando… fale agora";
  const t0 = performance.now();

  recognizer.recognizeOnceAsync(
    result => {
      const ms = Math.round(performance.now() - t0);
      const peak = meter.stop();
      btn.disabled = false; btn.textContent = "Gravar";

      const raw = result.properties.getProperty(S.PropertyId.SpeechServiceResponse_JsonResult) || "";
      $("raw").value = raw ? JSON.stringify(JSON.parse(raw), null, 2) : "(vazio)";
      log("resultado em " + ms + " ms | reason=" + result.reason + " | pico " + Math.round(peak*100) + "%");

      if(result.reason === S.ResultReason.NoMatch){
        recognizer.close();
        return verdict(false, "A Azure não reconheceu fala. Pico do microfone: " + Math.round(peak*100) + "%.");
      }
      if(result.reason === S.ResultReason.Canceled){
        const d = S.CancellationDetails.fromResult(result);
        log("cancelado | motivo=" + d.reason + " | code=" + d.errorCode + " | " + d.errorDetails);
        recognizer.close();
        return verdict(false, "Cancelado pela Azure: " + d.errorDetails);
      }

      try{
        const pa = S.PronunciationAssessmentResult.fromResult(result);
        $("scores").innerHTML =
          `<div class="score"><b>${Math.round(pa.pronunciationScore)}</b><span>Geral</span></div>` +
          `<div class="score"><b>${Math.round(pa.accuracyScore)}</b><span>Accuracy</span></div>` +
          `<div class="score"><b>${Math.round(pa.fluencyScore)}</b><span>Fluency</span></div>` +
          `<div class="score"><b>${Math.round(pa.completenessScore)}</b><span>Completeness</span></div>`;

        const parsed = JSON.parse(raw);
        const words = (parsed.NBest && parsed.NBest[0] && parsed.NBest[0].Words) || [];
        const hasSyll = words.some(w => Array.isArray(w.Syllables) && w.Syllables.length);
        const hasPhon = words.some(w => Array.isArray(w.Phonemes) && w.Phonemes.length);
        const prosody = parsed.NBest && parsed.NBest[0] && parsed.NBest[0].PronunciationAssessment
          && parsed.NBest[0].PronunciationAssessment.ProsodyScore;

        $("extra").innerHTML =
          kv("Reconhecido", result.text || "(nada)") +
          kv("Palavras no JSON", words.length) +
          kv("Fonemas por palavra", hasPhon ? "vindo" : "ausente", hasPhon ? "ok" : "bad") +
          kv("Sílabas por palavra", hasSyll ? "vindo" : "ausente", hasSyll ? "ok" : "warn") +
          kv("Prosódia", prosody !== undefined ? Math.round(prosody) : "ausente", prosody !== undefined ? "ok" : "warn") +
          kv("Pico do microfone", Math.round(peak*100) + "%");

        $("scorecard").style.display = "block";
        verdict(true, "O F0 aceitou o Pronunciation Assessment. Confira acima se fonema e sílaba vieram — é disso que a spec depende.");
      }catch(e){
        log("não consegui ler os scores: " + e.message);
        verdict(false, "Reconheceu a fala, mas o assessment não veio no resultado. Olhe o JSON bruto.");
      }
      recognizer.close();
    },
    err => {
      meter.stop();
      btn.disabled = false; btn.textContent = "Gravar";
      log("erro do recognizer: " + err);
      verdict(false, String(err));
      recognizer.close();
    }
  );
});

$("copyraw").addEventListener("click", () => navigator.clipboard.writeText($("raw").value)
  .then(() => { $("copyraw").textContent = "Copiado"; setTimeout(()=>{$("copyraw").textContent="Copiar JSON";},2000); })
  .catch(()=>{ $("raw").removeAttribute("readonly"); $("raw").select(); }));
$("copylog").addEventListener("click", () => navigator.clipboard.writeText($("log").value)
  .then(() => { $("copylog").textContent = "Copiado"; setTimeout(()=>{$("copylog").textContent="Copiar log";},2000); })
  .catch(()=>{ $("log").removeAttribute("readonly"); $("log").select(); }));
</script>
</body>
</html>
